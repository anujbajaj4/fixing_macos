name: Pages

# Publishes the download page and a mirror of the installer and the latest .dmg at
# https://anujbajaj4.github.io/fixing_macos/ (served by GitHub Pages, not by
# release-assets.githubusercontent.com, which some networks can't reach).
# One-time setup: Settings ▸ Pages ▸ Source: GitHub Actions.
on:
  push:
    branches: [main, claude/beautiful-goodall-cq50cw]
    paths: [site/**, install.sh, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read     # deploy-pages reads the uploaded artifact (needed when called from Release)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          cp install.sh _site/install.sh
          gh release download --repo "$GITHUB_REPOSITORY" --pattern MCClose.dmg --dir _site
          ls -la _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
